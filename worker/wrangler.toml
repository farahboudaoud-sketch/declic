# Serveur d'aide de Déclic (Cloudflare Workers).
# Secret à définir (jamais dans ce fichier) : CODES_ACCES (codes séparés par des virgules).
name = "declic-ia"
main = "src/index.js"
compatibility_date = "2026-11-01"
workers_dev = true

# IA de Cloudflare : gratuite jusqu'à 10 000 « neurons » par jour, sans clé à gérer.
[ai]
binding = "AI"

[observability]
enabled = true

[vars]
# Sites autorisés à appeler le serveur (séparés par des virgules).
ORIGINES = "https://farahboudaoud-sketch.github.io"
# Modèle utilisé. Plus économe (environ 3 fois plus d'aides par jour) : "@cf/google/gemma-4-26b-a4b-it".
MODELE = "@cf/mistralai/mistral-small-3.1-24b-instruct"
# Nombre maximum de demandes d'aide par code et par jour.
LIMITE_JOUR = "500"
